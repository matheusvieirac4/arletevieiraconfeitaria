name: Deploy para HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite disparar manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        timeout-minutes: 8       # falha rápido (em vez de travar 15 min e perder o log)
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # HostGator (hospedagem compartilhada) usa um certificado TLS generico
          # que nao bate com o dominio; no modo estrito a Action rejeita e falha.
          # "loose" aceita a conexao criptografada mesmo com esse certificado.
          security: loose
          server-dir: ./
          log-level: verbose      # mostra o passo exato onde falha (conexão/login/upload)
          timeout: 60000          # 60s por operação FTP
          # Nunca enviar/sincronizar estes itens (existem só no servidor):
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            includes/banco.php
            admin/config_financeiro.php
            admin/data/**
            cardapios/*.pdf
            img/imagens/blog/**
            links/logs/**
            README.md
            *.md
