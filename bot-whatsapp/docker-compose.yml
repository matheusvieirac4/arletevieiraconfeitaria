# Evolution API — conecta como dispositivo vinculado (igual WhatsApp Web).
# Ocupa 1 dos 4 slots; seu celular e o WhatsApp Web continuam funcionando.

# Rotacao de log: teto de 30MB por container (10MB x 3). Evita os logs encherem
# o disco — foi a classe de problema que travou o Docker (disco cheio) em set/2026.
x-logging: &logrot
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  evolution:
    image: evoapicloud/evolution-api:latest   # 'latest' traz Baileys atualizado; v2.1.1 travava no handshake do WhatsApp (set/2026)
    container_name: evolution_api
    restart: always
    logging: *logrot
    ports:
      - "8080:8080"
    environment:
      # --- Autenticacao ---
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}   # mesma chave que o bot usa no header apikey

      # --- Servidor ---
      SERVER_URL: ${SERVER_URL}                       # ex: http://SEU_IP:8080

      # --- Webhook global: manda os eventos pro bot ---
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_URL}              # ex: http://bot:3000/webhook (nome do servico abaixo)
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      # So os eventos que o bot usa (reduz ruido):
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"

      # --- Persistencia (Evolution guarda a sessao do WhatsApp aqui) ---
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"        # nao precisamos do historico; economiza disco
      DATABASE_SAVE_MESSAGE_UPDATE: "false"

      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    depends_on:
      - postgres
    networks: [botnet]

  # Postgres so pra Evolution nao perder o pareamento a cada restart do container.
  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: always
    logging: *logrot
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    networks: [botnet]

  # O bot: 1 arquivo Node, roda no mesmo compose pra ficar na mesma rede do Evolution.
  bot:
    build: .
    container_name: doceria_bot
    restart: always
    logging: *logrot
    env_file: .env
    volumes:
      - ./flow.json:/app/flow.json:ro   # editar os textos sem rebuildar
      - bot_state:/app/data             # state.json (flag HUMANO persistido)
    depends_on:
      - evolution
    networks: [botnet]

volumes:
  evolution_pg:
  bot_state:

networks:
  botnet:
    driver: bridge
